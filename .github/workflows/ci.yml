name: CI

on:
  push:
    branches: ["main"]
  pull_request:

# Versions are pinned rather than floating so a run today and a run in six
# months test the same thing. Actions are pinned to a commit SHA, with the tag
# in a trailing comment for readability.
env:
  PYTHON_VERSION: "3.13.15"
  NODE_VERSION: "24.14.1"
  NETLOG_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/netlog_ci"

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netlog_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # requirements-dev.txt pulls in the pipeline and the API requirements.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Report versions
        run: |
          python --version
          ruff --version
          pytest --version
          psql "$NETLOG_DATABASE_URL" -tAc 'select version()'

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -v

      - name: Smoke test the pipeline on the committed fixtures
        # Exercises the CLI end to end without downloading the dataset: load
        # the fixture twice to prove the load is idempotent, then aggregate.
        run: |
          python -m netlog_anomaly.pipeline init-db --reset
          python -m netlog_anomaly.pipeline load tests/fixtures/windows_bgl.log
          python -m netlog_anomaly.pipeline load tests/fixtures/windows_bgl.log
          python -m netlog_anomaly.pipeline aggregate --window-seconds 60
          psql "$NETLOG_DATABASE_URL" -tAc \
            'select count(*) from log_events' | grep -qx 12
          psql "$NETLOG_DATABASE_URL" -tAc \
            'select count(*) from window_features' | grep -qx 4

      - name: Check the download script parses and the dataset URL is reachable
        run: |
          bash -n scripts/download_data.sh
          curl --fail --silent --head --location \
            "https://zenodo.org/records/8196385/files/BGL.zip?download=1" > /dev/null

  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # ci rather than install: it installs exactly the lockfile and fails if
        # package.json and the lockfile disagree.
        run: npm ci

      - name: Report versions
        run: |
          node --version
          npm --version
          npx --no-install next --version
          npx --no-install tsc --version
          npx --no-install eslint --version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
